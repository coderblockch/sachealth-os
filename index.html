<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SacHealth OS - Clinical Triage & Bed Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pin third-party scripts to a fixed version to avoid pulling in
         unreviewed (potentially malicious) code from a floating tag. -->
    <script src="https://unpkg.com/lucide@0.475.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-slate-900 text-white p-6 font-sans min-h-screen">
 
    <!-- HEADER -->
    <header class="flex justify-between items-center mb-8 bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
        <div class="flex items-center gap-2">
            <i data-lucide="activity" class="text-blue-400"></i>
            <h1 class="text-2xl font-bold">SacHealth <span class="text-blue-400">OS</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <div id="auth-area" class="text-xs text-slate-300"></div>
            <div id="status" class="text-xs bg-slate-700 text-slate-300 px-3 py-1 rounded-full font-mono">
                CONNECTING...
            </div>
        </div>
    </header>

    <!-- LOGIN PANEL (hidden until "Staff login" is clicked) -->
    <form id="login-form" onsubmit="login(event)" class="hidden mb-8 bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col md:flex-row gap-3 md:items-end">
        <div class="flex-1">
            <label class="text-xs text-slate-400 uppercase font-bold" for="login-email">Email</label>
            <input id="login-email" type="email" autocomplete="username" required class="w-full bg-slate-700 border border-slate-600 p-2 rounded mt-1 outline-none focus:border-blue-400" placeholder="demo@sachealth.dev">
        </div>
        <div class="flex-1">
            <label class="text-xs text-slate-400 uppercase font-bold" for="login-password">Password</label>
            <input id="login-password" type="password" autocomplete="current-password" required class="w-full bg-slate-700 border border-slate-600 p-2 rounded mt-1 outline-none focus:border-blue-400">
        </div>
        <button type="submit" class="py-2 px-6 bg-blue-600 hover:bg-blue-500 font-bold rounded-lg">Sign in</button>
        <p class="text-xs text-slate-400 md:w-56">Public demo account (fake data): <span class="font-mono">demo@sachealth.dev</span> / <span class="font-mono">sachealth-demo</span></p>
        <p id="login-error" class="text-xs text-red-400 hidden"></p>
    </form>
 
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
 
        <!-- TRIAGE PANEL -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-blue-500/30 shadow-xl">
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2 text-blue-400">
                <i data-lucide="stethoscope"></i> Clinical Triage (CDSS)
            </h2>
 
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-slate-400 uppercase font-bold">Patient Name</label>
                    <input id="p-name" type="text" class="w-full bg-slate-700 border border-slate-600 p-2 rounded mt-1 outline-none focus:border-blue-400" placeholder="Full Name">
                </div>
                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="text-xs text-slate-400 uppercase font-bold">Age</label>
                        <input id="p-age" type="number" class="w-full bg-slate-700 border border-slate-600 p-2 rounded mt-1 outline-none focus:border-blue-400" placeholder="00">
                    </div>
                    <div class="w-1/2">
                        <label class="text-xs text-slate-400 uppercase font-bold">O2 Saturation (%)</label>
                        <input id="p-o2" type="number" class="w-full bg-slate-700 border border-slate-600 p-2 rounded mt-1 outline-none focus:border-blue-400" placeholder="98">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="text-xs text-slate-400 uppercase font-bold">Primary Symptoms</label>
                    <textarea id="p-symp" class="w-full bg-slate-700 border border-slate-600 p-2 rounded mt-1 outline-none focus:border-blue-400" rows="3" placeholder="e.g. Chest pain, fever..."></textarea>
                </div>
                <button onclick="runTriage()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl transition-all shadow-lg uppercase tracking-wider">
                    Analyze Patient
                </button>
            </div>
 
            <!-- RESULT BOX -->
            <div id="result-box" class="hidden mt-6 p-4 rounded-xl border transition-all duration-500">
                <p class="text-xs uppercase font-bold opacity-70">CDSS Recommendation:</p>
                <h3 id="res-rec" class="text-xl font-bold mb-1">---</h3>
                <p id="res-urg" class="text-sm font-medium"></p>
            </div>
        </div>
 
        <!-- BED STATUS SECTION -->
        <div class="lg:col-span-2">
            <h2 class="text-lg mb-4 text-slate-400 flex items-center gap-2">
                <i data-lucide="bed"></i> Real-Time Bed Status
            </h2>
            <div id="beds-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Beds injected here from the backend -->
            </div>
        </div>
    </div>
 
    <script>
        // Base URL of the FastAPI backend.
        // - Served by FastAPI itself (production on Render, or uvicorn locally
        //   at :8000): same origin, so relative paths are used.
        // - Served by a separate static server (python -m http.server 5500,
        //   on port 5500 as in the README) or opened as a file: the API runs on
        //   127.0.0.1:8000.
        // A deployment can also set window.API_URL in an earlier script.
        const STATIC_DEV = location.protocol === 'file:' || location.port === '5500';
        const API_URL = window.API_URL || (STATIC_DEV ? "http://127.0.0.1:8000" : "");
        const BED_STATUSES = ['Available', 'Occupied', 'Pending_Discharge', 'Cleaning'];

        // JWT from POST /auth/login, kept for this browser tab only.
        let authToken = sessionStorage.getItem('sachealth_token');
        let currentUser = null;

        // Shared helper: sends a request to the backend (adding the bearer
        // token when logged in), validates the response, returns parsed JSON.
        async function apiFetch(path, options = {}) {
            const headers = { ...(options.headers || {}) };
            if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
            const response = await fetch(`${API_URL}${path}`, { ...options, headers });
            if (response.status === 401 && authToken) {
                logout();
            }
            if (!response.ok) throw new Error('Backend error: ' + response.status);
            return response.json();
        }

        // --- Authentication ---
        function renderAuthArea() {
            const area = document.getElementById('auth-area');
            if (currentUser) {
                area.innerHTML = `Signed in as <b>${escapeHtml(currentUser.email)}</b>
                    <button onclick="logout()" class="ml-2 underline text-blue-300 hover:text-blue-200">Log out</button>`;
            } else {
                area.innerHTML = `<button onclick="toggleLogin()" class="px-3 py-1 rounded-full bg-blue-600 hover:bg-blue-500 font-bold">Staff login</button>`;
            }
        }

        function toggleLogin() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('login-email').focus();
        }

        async function login(event) {
            event.preventDefault();
            const errorEl = document.getElementById('login-error');
            errorEl.classList.add('hidden');
            try {
                const data = await apiFetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('login-email').value,
                        password: document.getElementById('login-password').value
                    })
                });
                authToken = data.access_token;
                sessionStorage.setItem('sachealth_token', authToken);
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('login-password').value = '';
                await loadCurrentUser();
                renderBeds();
            } catch (error) {
                errorEl.textContent = 'Invalid email or password.';
                errorEl.classList.remove('hidden');
            }
        }

        function logout() {
            authToken = null;
            currentUser = null;
            sessionStorage.removeItem('sachealth_token');
            renderAuthArea();
            renderBeds();
        }

        async function loadCurrentUser() {
            if (!authToken) { currentUser = null; renderAuthArea(); return; }
            try {
                currentUser = await apiFetch('/auth/me');
            } catch (error) {
                currentUser = null;
            }
            renderAuthArea();
        }

        // --- Update a bed (protected endpoint: PATCH /beds/{id}) ---
        async function saveBed(bedId) {
            const status = document.getElementById(`bed-status-${bedId}`).value;
            const patient = document.getElementById(`bed-patient-${bedId}`).value;
            try {
                await apiFetch(`/beds/${bedId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status, patient })
                });
                renderBeds();
            } catch (error) {
                alert('Could not update the bed. Please sign in again.');
                console.error(error);
            }
        }
 
        // Escape text before inserting into HTML to prevent XSS from
        // backend-provided values (patient names, bed status, etc.).
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function getColor(status) {
            if (status === 'Available') return 'bg-green-500';
            if (status === 'Occupied') return 'bg-red-500';
            if (status === 'Pending_Discharge') return 'bg-yellow-500';
            return 'bg-blue-500';
        }
 
        function setStatus(text, ok) {
            const el = document.getElementById('status');
            el.textContent = text;
            el.className = ok
                ? "text-xs bg-green-900 text-green-200 px-3 py-1 rounded-full font-mono"
                : "text-xs bg-red-900 text-red-200 px-3 py-1 rounded-full font-mono";
        }
 
        // --- Fetch beds from the backend (real full-stack call) ---
        async function renderBeds() {
            const grid = document.getElementById('beds-grid');
            grid.innerHTML = '<p class="text-slate-500 col-span-2">Loading beds...</p>';
 
            try {
                const beds = await apiFetch('/beds');
 
                grid.innerHTML = '';
                beds.forEach(bed => {
                    const colorClass = getColor(bed.status);
                    grid.innerHTML += `
                        <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 shadow-md">
                            <div class="flex justify-between mb-2">
                                <b class="text-slate-200">Bed ${escapeHtml(bed.num)}</b>
                                <div class="w-3 h-3 rounded-full ${colorClass}"></div>
                            </div>
                            <p class="text-sm text-slate-400">${escapeHtml(bed.patient || 'Empty')}</p>
                            <div class="mt-2">
                                <span class="text-[10px] px-2 py-1 rounded font-bold ${colorClass} text-slate-900 uppercase">${escapeHtml(bed.status)}</span>
                            </div>
                            ${currentUser ? `
                            <div class="mt-3 flex flex-wrap gap-2 items-center">
                                <select id="bed-status-${bed.id}" class="bg-slate-700 border border-slate-600 text-xs p-1 rounded">
                                    ${BED_STATUSES.map(s => `<option value="${s}" ${s === bed.status ? 'selected' : ''}>${s.replace('_', ' ')}</option>`).join('')}
                                </select>
                                <input id="bed-patient-${bed.id}" value="${escapeHtml(bed.patient || '')}" placeholder="Patient" maxlength="120" class="bg-slate-700 border border-slate-600 text-xs p-1 rounded flex-1 min-w-0">
                                <button onclick="saveBed(${Number(bed.id)})" class="text-xs px-2 py-1 bg-blue-600 hover:bg-blue-500 rounded font-bold">Save</button>
                            </div>` : ''}
                        </div>`;
                });
                setStatus('SYSTEM ONLINE', true);
            } catch (error) {
                grid.innerHTML = '<p class="text-red-400 col-span-2">⚠️ Could not load beds. Is the backend running?</p>';
                setStatus('BACKEND OFFLINE', false);
                console.error(error);
            }
        }
 
        // --- Send patient to the backend CDSS endpoint ---
        async function runTriage() {
            const name = document.getElementById('p-name').value || "Patient";
            const age = parseInt(document.getElementById('p-age').value) || 0;
            const o2 = parseInt(document.getElementById('p-o2').value) || 100;
            const symp = document.getElementById('p-symp').value;
 
            const box = document.getElementById('result-box');
            const recEl = document.getElementById('res-rec');
            const urgEl = document.getElementById('res-urg');
 
            try {
                const data = await apiFetch('/triage/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        patient_name: name,
                        age: age,
                        symptoms: symp,
                        oxygen_level: o2
                    })
                });
 
                box.className = `mt-6 p-4 rounded-xl border ${data.color} text-slate-900 font-bold shadow-xl`;
                recEl.textContent = data.recommendation;
                urgEl.textContent = `Priority Level: ${data.priority} (${data.urgency})`;
                box.classList.remove('hidden');
            } catch (error) {
                box.className = "mt-6 p-4 rounded-xl border bg-red-900 text-red-200 font-bold";
                recEl.innerHTML = "⚠️ Analysis failed";
                urgEl.innerHTML = "Could not reach the backend. Is it running?";
                box.classList.remove('hidden');
                console.error(error);
            }
        }
 
        window.onload = async () => {
            // Icons are decorative: never let a CDN failure block the app.
            try { lucide.createIcons(); } catch (error) { console.warn('Icons unavailable', error); }
            await loadCurrentUser();
            renderBeds();
        };
    </script>
</body>
</html>
